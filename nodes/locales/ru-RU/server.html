<script type="text/x-red" data-help-name="zigbee2mqtt-server">
    <p>Подключение к вашему мосту Zigbee2MQTT</p>
    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt class="optional">Имя <span class="property-type">строка</span></dt><dd>Укажите любое имя, чтобы отличать этот узел.</dd>
        <dt class="optional">Метка потока <span class="property-type">строка</span></dt><dd>Необязательная метка длиной до 24 символов. Она добавляется в квадратных скобках к названиям узлов Bridge, In, Get и Out, использующих этот сервер. Например: <code>Лампа [Верхний этаж]</code>. Оставьте поле пустым, чтобы названия не менялись.</dd>
        <dt>Хост MQTT <span class="property-type">строка</span></dt><dd>IP-адрес или имя MQTT-хоста экземпляра Zigbee2MQTT. Примеры: <code>127.0.0.1</code>, <code>192.168.1.100</code>, <code>myzigbee2mqtt.dydns.com</code></dd>
        <dt class="required">Базовый топик <span class="property-type">строка</span></dt><dd>Такой же, как в <code>configuration.yaml</code>.</dd>
        <dt class="optional">Префикс обнаружения Home Assistant <span class="property-type">строка</span></dt><dd>Префикс MQTT Discovery из настроек Home Assistant. По умолчанию: <code>homeassistant</code>. Используется переключателем Home Assistant в узлах In.</dd>
        <dt class="optional">Порт MQTT <span class="property-type">число</span></dt><dd>Порт MQTT по умолчанию — 1883.</dd>
        <dt class="optional">Имя пользователя MQTT <span class="property-type">строка</span></dt><dd></dd>
        <dt class="optional">Пароль MQTT <span class="property-type">строка</span></dt><dd></dd>
    </dl>
    <h3>Начальное состояние устройств</h3>
    <p>При подключении узел немного ждёт сохранённые MQTT-состояния. Если состояния всё ещё нет, он запрашивает читаемые значения только у устройств, которые не отключены и не отмечены как недоступные функцией availability в Zigbee2MQTT. Неудачный запрос не повторяется при каждом обновлении списка устройств. Новая попытка выполняется, когда устройство снова выходит в сеть, включается или возвращается в список, либо восстанавливается MQTT-соединение.</p>
    <p>Чтобы определять недоступные устройства, включите availability в Zigbee2MQTT.</p>
    <p>Чтобы MQTT-брокер передавал последнее состояние при переподключении, включите retain для устройства в <code>configuration.yaml</code> Zigbee2MQTT:</p>
    <pre><code>devices:
  '0x00158d0001abcdef':
    retain: true</code></pre>
    <p>Retained-сообщение содержит последнее опубликованное устройством состояние. Включение retain не создаст значение, пока устройство не опубликует его снова.</p>
</script>
