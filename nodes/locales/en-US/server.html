<script type="text/x-red" data-help-name="zigbee2mqtt-server">
    <p>Connection to your Zigbee2mqtt bridge</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt class="optional">Name <span class="property-type">string</span></dt><dd>Choose any name to identify your node.</dd>
        <dt class="optional">Flow label <span class="property-type">string</span></dt><dd>Optional label, up to 24 characters. It is added in square brackets to the labels of Bridge, In, Get, and Out nodes that use this server. For example: <code>Lamp [Upstairs]</code>. Leave blank to keep their current labels.</dd>
        <dt>MQTT Host <span class="property-type">string</span></dt><dd>IP-address or MQTT Host of your zigbee2mqtt instance. Examples: <code>127.0.0.1</code>, <code>192.168.1.100</code>, <code>myzigbee2mqtt.dydns.com</code></dd>
         <dt class="required">Base topic <span class="property-type">string</span></dt><dd> Same as in your configuration.yaml</dd>
        <dt class="optional">Home Assistant discovery prefix <span class="property-type">string</span></dt><dd>MQTT Discovery prefix configured in Home Assistant. Default: <code>homeassistant</code>. Used by the Home Assistant switch option on In nodes.</dd>
        <dt class="optional">MQTT Port <span class="property-type">number</span></dt><dd>default port for mqtt is 1883</dd>
        <dt class="optional">MQTT Username <span class="property-type">string</span></dt><dd></dd>
        <dt class="optional">MQTT Password <span class="property-type">string</span></dt><dd></dd>
    </dl>
    <h3>Initial device state</h3>
    <p>On connection, the node waits briefly for retained device states. If a state is still missing, it requests readable values only from devices not marked disabled or reported offline by Zigbee2MQTT's availability feature. It does not repeat a failed request on each device-list update; another attempt is made after the device comes online, is re-enabled or re-added, or the MQTT connection reconnects.</p>
    <p>Offline detection requires Zigbee2MQTT's availability feature to be enabled.</p>
    <p>To restore the last state from the MQTT broker after reconnecting, enable retain for the device in Zigbee2MQTT's <code>configuration.yaml</code>:</p>
    <pre><code>devices:
  '0x00158d0001abcdef':
    retain: true</code></pre>
    <p>Retained data is the last state published by the device. Enabling retain does not create a value until the device publishes again.</p>
</script>
