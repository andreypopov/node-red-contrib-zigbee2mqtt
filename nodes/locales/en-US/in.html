<script type="text/x-red" data-help-name="zigbee2mqtt-in">
    <p>This node listens for MQTT messages from a Zigbee2MQTT bridge.</p>
    <p>The <code>action</code> field is an event. It is not carried over into later battery, linkquality or other state updates from the same device.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt class="optional">Name <span class="property-type">string</span></dt><dd>Choose a name to identify this node.</dd>
        <dt>Server <span class="property-type">object</span></dt><dd>Select the Zigbee2MQTT server to use.</dd>
        <dt>Device <span class="property-type">string</span></dt><dd>Select the device or devices to listen to.</dd>
        <dt class="optional">Payload output <span class="property-type">string</span></dt><dd>Choose which value to send in <code>msg.payload</code>.</dd>
        <dt class="optional">Start output <span class="property-type">boolean</span></dt><dd>Send the current state when the node starts.</dd>
        <dt class="optional">Filter <span class="property-type">boolean</span></dt><dd>Send only when the selected value changes. Disable this for buttons.</dd>
        <dt class="optional">Compare properties <span class="property-type">array</span></dt><dd>When Filter is enabled, compare only these state properties. The full payload is still output. Leave empty to compare the complete payload.</dd>
        <dt class="optional">Multiple devices <span class="property-type">boolean</span></dt><dd>Receive updates from each selected device.</dd>
        <dt class="optional">Expose to Home Assistant <span class="property-type">boolean</span></dt><dd>Creates a Home Assistant switch for this input node. Turn it off to pause messages from this node. The Zigbee2MQTT subscription stays active, and messages received while the switch is off are discarded. Home Assistant's MQTT integration must connect to the same broker as the Server node with MQTT Discovery enabled. The Home Assistant Companion app is optional.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt><dd>The selected state value or complete state, depending on Payload output.</dd>
        <dt>payload_raw <span class="property-type">object</span></dt><dd>The complete device state.</dd>
        <dt>item <span class="property-type">object</span></dt><dd>Device or group information.</dd>
    </dl>
</script>
