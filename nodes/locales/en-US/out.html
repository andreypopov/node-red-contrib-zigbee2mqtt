<script type="text/x-red" data-help-name="zigbee2mqtt-out">
    <p>Send an MQTT command to your device.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt class="optional">Name <span class="property-type">string</span></dt><dd>Choose a name to identify this node.</dd>
        <dt>Server <span class="property-type">object</span></dt><dd>Choose the zigbee2mqtt server instance.</dd>
        <dt>Device <span class="property-type">string</span></dt>
        <dd>
            Select your device. To choose a target per message, set Device to <code>msg.topic</code>.
            <p>With Server base topic <code>zigbee2mqtt</code>:</p>
            <ul>
                <li><code>living_room</code> or <code>zigbee2mqtt/living_room</code> → <code>zigbee2mqtt/living_room/set</code></li>
                <li><code>living_room/left/set</code> or <code>zigbee2mqtt/living_room/left/set</code> → endpoint <code>left</code></li>
            </ul>
            A device name, IEEE address, numeric ID, selector value, or device topic can also be used alone; the node then uses the device's default <code>/set</code> topic. Full topics must use the Server base topic. An endpoint is one path segment and is passed through without checking that the device has it. Groups support device-level topics only. Command and Payload form the JSON request.
        </dd>
        <dt>Command <span class="property-type">string</span></dt>
        <dd>
            <ul>
                <li><b>zigbee2mqtt:</b> predefined commands</li>
                <li><b>homekit:</b> select for data from a HomeKit node</li>
                <li><b>json:</b> custom JSON data</li>
            </ul>
        </dd>
        <dt>Payload <span class="property-type">string or object</span></dt><dd>Select the payload data source.</dd>
    </dl>
    <h3>Output</h3>
    <p>Optional. When enabled, adds one output. <b>Send output</b> chooses when it is sent.</p>
    <p><b>After the device's state update</b>: after publishing a command to a device, the node waits for that device's next live state update, for up to 30 seconds. It sends a copy of the input message with the original <code>msg.payload</code> in <code>msg.payload_in</code>, the full updated state in <code>msg.payload</code> and <code>msg.payload_raw</code>, and the device state topic in <code>msg.topic</code>. If no update arrives, no output is sent. Group commands do not produce output because a group has no single device state.</p>
    <p>The state update is not correlated with the command; it is simply the next live update from that device.</p>
    <p><b>As soon as the command is sent</b>: the node sends a copy of the input message straight after publishing, for devices and groups, with the original <code>msg.payload</code> in <code>msg.payload_in</code> and <code>msg.payload</code> set to <code>true</code>, or <code>false</code> if the command could not be published or there was no device or payload. Use this to continue a flow after every command, for example in a loop that repeats a command until the device reports the state you want.</p>
</script>
