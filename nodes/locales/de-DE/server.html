<script type="text/x-red" data-help-name="zigbee2mqtt-server">
    <p>Verbindung zu Ihrer Zigbee2MQTT-Bridge</p>
    <h3>Konfiguration</h3>
    <dl class="message-properties">
        <dt class="optional">Name <span class="property-type">Zeichenfolge</span></dt><dd>Wählen Sie einen beliebigen Namen zur Identifizierung dieses Nodes.</dd>
        <dt class="optional">Flow-Kennzeichnung <span class="property-type">Zeichenfolge</span></dt><dd>Optionale Kennzeichnung mit bis zu 24 Zeichen. Sie wird in eckigen Klammern an die Beschriftungen der Bridge-, In-, Get- und Out-Nodes angehängt, die diesen Server verwenden. Beispiel: <code>Lampe [Obergeschoss]</code>. Leer lassen, damit die bisherigen Beschriftungen erhalten bleiben.</dd>
        <dt>MQTT-Host <span class="property-type">Zeichenfolge</span></dt><dd>IP-Adresse oder MQTT-Host Ihrer Zigbee2MQTT-Instanz. Beispiele: <code>127.0.0.1</code>, <code>192.168.1.100</code>, <code>myzigbee2mqtt.dydns.com</code></dd>
        <dt class="required">Basis-Topic <span class="property-type">Zeichenfolge</span></dt><dd>Wie in Ihrer <code>configuration.yaml</code>.</dd>
        <dt class="optional">Home-Assistant-Discovery-Präfix <span class="property-type">Zeichenfolge</span></dt><dd>Das in Home Assistant konfigurierte MQTT-Discovery-Präfix. Standard: <code>homeassistant</code>. Wird von der Home-Assistant-Schalteroption der In-Nodes verwendet.</dd>
        <dt class="optional">MQTT-Port <span class="property-type">Zahl</span></dt><dd>Der Standardport für MQTT ist 1883.</dd>
        <dt class="optional">MQTT-Benutzername <span class="property-type">Zeichenfolge</span></dt><dd></dd>
        <dt class="optional">MQTT-Passwort <span class="property-type">Zeichenfolge</span></dt><dd></dd>
    </dl>
    <h3>Anfangszustand der Geräte</h3>
    <p>Beim Verbinden wartet der Node kurz auf gespeicherte MQTT-Zustände. Fehlt danach ein Zustand, fragt er lesbare Werte nur bei Geräten ab, die nicht deaktiviert und von der Zigbee2MQTT-Verfügbarkeitsfunktion nicht als offline gemeldet sind. Eine fehlgeschlagene Anfrage wird nicht bei jeder Aktualisierung der Geräteliste wiederholt. Ein neuer Versuch erfolgt, wenn das Gerät wieder online, erneut aktiviert oder wieder hinzugefügt wird oder die MQTT-Verbindung erneut hergestellt wird.</p>
    <p>Für die Offline-Erkennung muss die Verfügbarkeitsfunktion von Zigbee2MQTT aktiviert sein.</p>
    <p>Damit der MQTT-Broker den letzten Zustand nach einer erneuten Verbindung sendet, aktivieren Sie für das Gerät in der Zigbee2MQTT-<code>configuration.yaml</code> retain:</p>
    <pre><code>devices:
  '0x00158d0001abcdef':
    retain: true</code></pre>
    <p>Gespeicherte Daten entsprechen dem zuletzt vom Gerät veröffentlichten Zustand. Ein Wert wird erst gespeichert, nachdem das Gerät erneut einen Zustand veröffentlicht hat.</p>
</script>
