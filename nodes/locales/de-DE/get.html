<script type="text/x-red" data-help-name="zigbee2mqtt-get">
    <p>Gibt den aktuellen Gerätestatus zurück. Ist der angeforderte Status nicht im Cache des Knotens vorhanden, fragt er lesbare Eigenschaften bei Zigbee2MQTT ab und wartet bis zu 15 Sekunden auf eine aktuelle Antwort. Im Modus für ein einzelnes Gerät wird keine Nachricht gesendet, wenn es keine lesbaren Eigenschaften hat oder nicht antwortet. Bei Gruppen wird nur der Cache verwendet; Zigbee2MQTT bietet keine Gruppenanfrage per <code>/get</code>.</p>
    <p>Wenn Mehrere Geräte aktiviert ist, sendet der Knoten nach Abschluss der Anfragen die letzten zwischengespeicherten Zustände, auch wenn einige Geräte nicht gelesen werden konnten. Ein Gerät ohne zwischengespeicherten Zustand bleibt mit <code>payload: null</code> in der Ausgabe. Eine Warnung nennt die Geräte, die nicht gelesen werden konnten.</p>
    <h3>Konfiguration</h3>
    <dl class="message-properties">
        <dt class="optional">Name <span class="property-type">string</span></dt><dd>Wählen Sie einen beliebigen Namen zur Identifizierung des Knotens.</dd>
        <dt>Server <span class="property-type">object</span></dt><dd>Wählen Sie die zu verwendende Zigbee2MQTT-Serverinstanz.</dd>
        <dt>Gerät <span class="property-type">string</span></dt><dd>Wählen Sie das Gerät aus.</dd>
    </dl>
    <h3>Ausgaben</h3>
    <h5>Ausgabe</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt><dd>Aktueller Wert</dd>
        <dt>payload_in <span class="property-type">object</span></dt><dd>Eingehender Payload</dd>
        <dt>payload_raw <span class="property-type">object</span></dt><dd>Vollständiger Payload</dd>
        <dt>device <span class="property-type">object</span></dt><dd>Geräteinformationen</dd>
    </dl>
</script>
