<script type="text/x-red" data-help-name="zigbee2mqtt-in">
    <p>Tento uzol počúva MQTT správy od Zigbee2MQTT mosta (bridge).</p>
    <h3>Konfigurácia</h3>
    <dl class="message-properties">
        <dt class="optional">Meno <span class="property-type">reťazec</span></dt><dd>Vyberte meno na identifikáciu uzla.</dd>
        <dt>Server <span class="property-type">objekt</span></dt><dd>Vyberte server Zigbee2MQTT, ktorý chcete použiť.</dd>
        <dt>Zariadenie <span class="property-type">reťazec</span></dt><dd>Vyberte zariadenie alebo zariadenia, ktoré chcete počúvať.</dd>
        <dt class="optional">Výstup payloadu <span class="property-type">reťazec</span></dt><dd>Vyberte hodnotu, ktorá sa odošle v <code>msg.payload</code>.</dd>
        <dt class="optional">Odosielať pri spustení <span class="property-type">boolean</span></dt><dd>Pri spustení uzla odošle aktuálny stav.</dd>
        <dt class="optional">Filtrovať zmeny <span class="property-type">boolean</span></dt><dd>Odošle správu iba pri zmene vybranej hodnoty. Pri tlačidlách filter vypnite.</dd>
        <dt class="optional">Porovnávať vlastnosti <span class="property-type">zoznam</span></dt><dd>Pri zapnutom filtri sa porovnávajú iba tieto vlastnosti stavu, no výstupom zostáva celý payload. Nechajte zoznam prázdny na porovnanie celého payloadu.</dd>
        <dt class="optional">Viacero zariadení <span class="property-type">boolean</span></dt><dd>Prijíma aktualizácie z každého vybraného zariadenia.</dd>
        <dt class="optional">Zobraziť v Home Assistant <span class="property-type">boolean</span></dt><dd>Vytvorí prepínač Home Assistant pre tento vstupný uzol. Vypnutím pozastavíte odosielanie správ z tohto uzla. Odber Zigbee2MQTT zostane aktívny a správy prijaté počas vypnutia sa zahodia. Integrácia MQTT v Home Assistant musí byť pripojená k rovnakému brokeru ako uzol Server a musí mať zapnuté MQTT Discovery. Aplikácia Home Assistant Companion nie je potrebná.</dd>
    </dl>
    <h3>Výstupy</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">reťazec | objekt</span></dt><dd>Vybraná hodnota alebo celý stav podľa nastavenia výstupu payloadu.</dd>
        <dt>payload_raw <span class="property-type">objekt</span></dt><dd>Úplný stav zariadenia.</dd>
        <dt>item <span class="property-type">objekt</span></dt><dd>Informácie o zariadení alebo skupine.</dd>
    </dl>
</script>
