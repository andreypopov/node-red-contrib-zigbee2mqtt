<script type="text/x-red" data-help-name="zigbee2mqtt-out">
    <p>Odošle MQTT príkaz vášmu zariadeniu.</p>
    <h3>Konfigurácia</h3>
    <dl class="message-properties">
        <dt class="optional">Meno <span class="property-type">reťazec</span></dt><dd>Vyberte meno na identifikáciu uzla.</dd>
        <dt>Server <span class="property-type">objekt</span></dt><dd>Vyberte inštanciu servera zigbee2mqtt.</dd>
        <dt>Zariadenie <span class="property-type">reťazec</span></dt>
        <dd>
            Vyberte zariadenie. Nastavte „Zariadenie“ na <code>msg.topic</code>, aby sa cieľ vyberal pre každú správu.
            <p>Pri základnej téme servera <code>zigbee2mqtt</code>:</p>
            <ul>
                <li><code>living_room</code> alebo <code>zigbee2mqtt/living_room</code> → <code>zigbee2mqtt/living_room/set</code></li>
                <li><code>living_room/left/set</code> alebo <code>zigbee2mqtt/living_room/left/set</code> → koncový bod <code>left</code></li>
            </ul>
            Samostatne možno použiť aj názov zariadenia, IEEE adresu, číselné ID, hodnotu selektora alebo tému zariadenia; uzol potom použije predvolenú tému <code>/set</code>. Úplná téma musí používať základnú tému servera. Koncový bod tvorí jednu časť cesty a odošle sa bez kontroly, či ho zariadenie podporuje. Skupiny podporujú iba témy na úrovni zariadenia. Príkaz a Payload tvoria JSON požiadavku.
        </dd>
        <dt>Príkaz <span class="property-type">reťazec</span></dt>
        <dd>
            <ul>
                <li><b>zigbee2mqtt:</b> preddefinované príkazy</li>
                <li><b>homekit:</b> vyberte, ak údaje pochádzajú z uzla HomeKit</li>
                <li><b>json:</b> vlastné údaje vo formáte JSON</li>
            </ul>
        </dd>
        <dt>Payload <span class="property-type">reťazec alebo objekt</span></dt><dd>Vyberte zdroj údajov Payload.</dd>
    </dl>
    <h3>Výstup</h3>
    <p>Voliteľné. Po zapnutí sa pridá jeden výstup. Po publikovaní príkazu uzol čaká najviac 30 sekúnd na ďalšiu živú aktualizáciu stavu zariadenia. Odošle kópiu vstupnej správy: pôvodný <code>msg.payload</code> bude v <code>msg.payload_in</code>, celý aktualizovaný stav v <code>msg.payload</code> a <code>msg.payload_raw</code> a téma stavu zariadenia v <code>msg.topic</code>. Ak aktualizácia nepríde, správa sa neodošle. Príkazy skupine nevytvoria výstup, pretože skupina nemá jeden spoločný stav zariadenia.</p>
    <p>Aktualizácia stavu nie je priradená ku konkrétnemu príkazu; ide jednoducho o ďalšiu živú aktualizáciu daného zariadenia.</p>
</script>
