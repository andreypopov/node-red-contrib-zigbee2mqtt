<script type="text/x-red" data-help-name="zigbee2mqtt-server">
    <p>Pripojenie k vášmu Zigbee2mqtt mostu (bridge)</p>
    <h3>Konfigurácia</h3>
    <dl class="message-properties">
        <dt class="optional">Meno <span class="property-type">reťazec</span></dt><dd>Vyberte akékoľvek meno na identifikáciu vášho uzla.</dd>
        <dt class="optional">Označenie toku <span class="property-type">reťazec</span></dt><dd>Voliteľné označenie s maximálne 24 znakmi. Pridá sa v hranatých zátvorkách k názvom uzlov Bridge, In, Get a Out, ktoré používajú tento server. Napríklad: <code>Lampa [Poschodie]</code>. Ak pole necháte prázdne, názvy zostanú nezmenené.</dd>
        <dt>MQTT Host <span class="property-type">reťazec</span></dt><dd>IP adresa alebo hostiteľ MQTT vášho Zigbee2mqtt inštancie. Príklady: <code>127.0.0.1</code>, <code>192.168.1.100</code>, <code>myzigbee2mqtt.dydns.com</code></dd>
        <dt class="required">Základná téma <span class="property-type">reťazec</span></dt><dd>Rovnaká ako vo vašom configuration.yaml</dd>
        <dt class="optional">Discovery prefix Home Assistant <span class="property-type">reťazec</span></dt><dd>MQTT Discovery prefix nastavený v Home Assistant. Predvolené: <code>homeassistant</code>. Používa ho prepínač Home Assistant v uzloch In.</dd>
        <dt class="optional">MQTT Port <span class="property-type">číslo</span></dt><dd>predvolený port pre MQTT je 1883</dd>
        <dt class="optional">Úroveň protokolovania <span class="property-type">reťazec</span></dt><dd>Minimálna úroveň protokolov balíka: <code>notice</code> zobrazuje všetky správy, <code>warning</code> zobrazuje upozornenia a chyby a <code>error</code> zobrazuje iba chyby.</dd>
        <dt class="optional">MQTT Užívateľské meno <span class="property-type">reťazec</span></dt><dd></dd>
        <dt class="optional">MQTT Heslo <span class="property-type">reťazec</span></dt><dd></dd>
    </dl>
    <h3>Počiatočný stav zariadení</h3>
    <p>Pri pripojení uzol krátko počká na uchované MQTT stavy. Ak stav stále chýba, vyžiada čitateľné hodnoty iba od zariadení, ktoré nie sú vypnuté ani označené ako nedostupné funkciou dostupnosti v Zigbee2MQTT. Neúspešnú požiadavku neopakuje pri každej aktualizácii zoznamu zariadení. Skúsi to znova až po návrate zariadenia do online stavu, jeho opätovnom povolení alebo pridaní, prípadne po obnovení MQTT spojenia.</p>
    <p>Na zisťovanie nedostupných zariadení musí byť v Zigbee2MQTT zapnutá funkcia dostupnosti.</p>
    <p>Ak chcete, aby MQTT broker po opätovnom pripojení poslal posledný stav, zapnite retain pre zariadenie v súbore Zigbee2MQTT <code>configuration.yaml</code>:</p>
    <pre><code>devices:
  '0x00158d0001abcdef':
    retain: true</code></pre>
    <p>Uchovaný údaj predstavuje posledný stav publikovaný zariadením. Zapnutie retain nevytvorí hodnotu, kým zariadenie znova nepublikuje svoj stav.</p>
</script>
