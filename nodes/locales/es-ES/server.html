<script type="text/x-red" data-help-name="zigbee2mqtt-server">
    <p>Conexión con tu puente Zigbee2MQTT</p>
    <h3>Configuración</h3>
    <dl class="message-properties">
        <dt class="optional">Nombre <span class="property-type">cadena</span></dt><dd>Elige un nombre para identificar este nodo.</dd>
        <dt class="optional">Etiqueta del flujo <span class="property-type">cadena</span></dt><dd>Etiqueta opcional de hasta 24 caracteres. Se añade entre corchetes a las etiquetas de los nodos Bridge, In, Get y Out que usan este servidor. Por ejemplo: <code>Lámpara [Planta alta]</code>. Déjala vacía para conservar las etiquetas actuales.</dd>
        <dt>Host MQTT <span class="property-type">cadena</span></dt><dd>Dirección IP o host MQTT de tu instancia de Zigbee2MQTT. Ejemplos: <code>127.0.0.1</code>, <code>192.168.1.100</code>, <code>myzigbee2mqtt.dydns.com</code></dd>
        <dt class="required">Tema base <span class="property-type">cadena</span></dt><dd>El mismo valor que en tu <code>configuration.yaml</code>.</dd>
        <dt class="optional">Prefijo de descubrimiento de Home Assistant <span class="property-type">cadena</span></dt><dd>Prefijo MQTT Discovery configurado en Home Assistant. Predeterminado: <code>homeassistant</code>. Lo usa la opción de interruptor de Home Assistant en los nodos In.</dd>
        <dt class="optional">Puerto MQTT <span class="property-type">número</span></dt><dd>El puerto predeterminado de MQTT es 1883.</dd>
        <dt class="optional">Nivel de registro <span class="property-type">cadena</span></dt><dd>Nivel mínimo de los registros del paquete: <code>notice</code> muestra todos los mensajes, <code>warning</code> muestra avisos y errores, y <code>error</code> muestra solo errores.</dd>
        <dt class="optional">Usuario MQTT <span class="property-type">cadena</span></dt><dd></dd>
        <dt class="optional">Contraseña MQTT <span class="property-type">cadena</span></dt><dd></dd>
    </dl>
    <h3>Estado inicial de los dispositivos</h3>
    <p>Al conectarse, el nodo espera brevemente los estados MQTT retenidos. Si falta algún estado, solo solicita los valores legibles de dispositivos que no estén desactivados ni aparezcan como desconectados en la función de disponibilidad de Zigbee2MQTT. No repite una solicitud fallida cada vez que se actualiza la lista. Solo vuelve a intentarlo cuando el dispositivo vuelve a estar en línea, se reactiva o se añade de nuevo, o cuando se restablece la conexión MQTT.</p>
    <p>Para detectar dispositivos desconectados, debe estar habilitada la función de disponibilidad de Zigbee2MQTT.</p>
    <p>Para que el broker MQTT envíe el último estado tras una reconexión, activa retain para el dispositivo en el <code>configuration.yaml</code> de Zigbee2MQTT:</p>
    <pre><code>devices:
  '0x00158d0001abcdef':
    retain: true</code></pre>
    <p>El dato retenido es el último estado publicado por el dispositivo. Activar retain no crea un valor hasta que el dispositivo vuelva a publicar.</p>
</script>
